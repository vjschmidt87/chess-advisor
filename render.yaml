services:
  - type: web
    name: chess-advisor-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: chess-advisor-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: chess-advisor-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: chess-advisor-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: chess-advisor-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: chess-advisor-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: CORS_ALLOWED_ORIGINS
        value: https://vjschmidt87.github.io
    healthCheckPath: /api/health

databases:
  - name: chess-advisor-db
    plan: free
    databaseName: chess_advisor
    user: chess_advisor_user
