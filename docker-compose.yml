version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chess-advisor-db
    environment:
      POSTGRES_DB: chess_advisor
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5438:5432"
    volumes:
      - chess_advisor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d chess_advisor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chess-advisor-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess-advisor-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chess_advisor
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8086/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chess-advisor-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess-advisor-frontend
    ports:
      - "4206:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chess-advisor-net

volumes:
  chess_advisor_pgdata:
    name: chess_advisor_pgdata

networks:
  chess-advisor-net:
    driver: bridge
